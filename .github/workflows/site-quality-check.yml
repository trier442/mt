name: Redirect quality check

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.xml'
      - 'CNAME'
      - '.github/workflows/site-quality-check.yml'
  pull_request:
    paths:
      - '*.html'
      - '*.xml'
      - 'CNAME'
      - '.github/workflows/site-quality-check.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration redirects
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          new_host = "https://munhaeryeokplus.com"

          articles = sorted(Path('.').glob('literacy-grade*.html'))
          assert len(articles) == 28, f'Expected 28 migrated article redirects, found {len(articles)}'

          required = [
              Path('index.html'), Path('literacy.html'), Path('selection.html'),
              *[Path(f'grade{g}.html') for g in range(3, 10)],
              *articles,
              Path('about.html'), Path('contact.html'), Path('copyright.html'),
              Path('editorial-policy.html'), Path('privacy.html'),
              Path('terms.html'), Path('subscribe.html')
          ]

          for page in required:
              text = page.read_text(encoding='utf-8')
              assert new_host in text, f'{page}: new domain missing'
              assert 'noindex,follow' in text, f'{page}: noindex,follow missing'
              assert 'rel="canonical"' in text, f'{page}: canonical missing'
              assert 'http-equiv="refresh"' in text, f'{page}: meta refresh missing'
              assert 'location.replace' in text, f'{page}: JavaScript redirect missing'

          for article in articles:
              expected = f'{new_host}/literacy/{article.name}'
              text = article.read_text(encoding='utf-8')
              assert expected in text, f'{article}: wrong migration target'

          for grade in range(3, 10):
              expected = f'{new_host}/literacy/grade{grade}.html'
              text = Path(f'grade{grade}.html').read_text(encoding='utf-8')
              assert expected in text, f'grade{grade}: wrong migration target'

          selection = Path('selection.html').read_text(encoding='utf-8')
          assert f'{new_host}/literacy/selection.html' in selection

          home = Path('index.html').read_text(encoding='utf-8')
          assert f'{new_host}/literacy/' in home

          cname = Path('CNAME').read_text(encoding='utf-8').strip()
          assert cname == 'www.rhoduss.com', f'Unexpected CNAME: {cname}'

          sitemap = Path('sitemap.xml').read_text(encoding='utf-8')
          assert sitemap.count('<url>') >= 50, 'Old-domain redirect sitemap is unexpectedly small'
          PY
